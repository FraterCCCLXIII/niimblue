<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Choose a device</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1f1f1f;
        --muted: #8b8b8b;
        --line: #ececec;
        --hover: #f7f7f7;
        --active: #fff1f0;
        --accent: #ff4d4f;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px/1.4 "Noto Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .wrap {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      h1 {
        margin: 0;
        padding: 16px 18px 12px;
        font-size: 16px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        padding: 10px 18px 0;
      }

      .list {
        flex: 1;
        overflow: auto;
        padding: 8px;
      }

      button.device {
        appearance: none;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        border-radius: 8px;
        padding: 10px 12px;
        color: inherit;
        cursor: pointer;
      }

      button.device:hover {
        background: var(--hover);
      }

      .name {
        font-weight: 600;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
      }

      .empty {
        color: var(--muted);
        padding: 24px 12px;
        text-align: center;
      }

      .footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
      }

      .footer button {
        appearance: none;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 999px;
        min-height: 32px;
        padding: 0 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 id="title">Choose a device</h1>
      <div class="hint" id="hint">Searching…</div>
      <div class="list" id="list">
        <div class="empty">No devices yet</div>
      </div>
      <div class="footer">
        <button type="button" id="cancel">Cancel</button>
      </div>
    </div>
    <script>
      const listEl = document.getElementById("list");
      const hintEl = document.getElementById("hint");
      const titleEl = document.getElementById("title");
      const params = new URLSearchParams(location.search);
      const kind = params.get("kind") || "device";
      titleEl.textContent = kind === "serial" ? "Choose a serial port" : "Choose a Bluetooth printer";
      hintEl.textContent = kind === "serial" ? "Select the printer port." : "Turn the printer on and wait for it to appear.";

      const render = (devices) => {
        if (!devices?.length) {
          listEl.innerHTML = '<div class="empty">No devices yet</div>';
          return;
        }
        listEl.innerHTML = "";
        for (const device of devices) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "device";
          button.innerHTML = `<div class="name">${device.name || "Unknown device"}</div><div class="meta">${device.id}</div>`;
          button.addEventListener("click", () => window.devicePicker.select(device.id));
          listEl.appendChild(button);
        }
      };

      window.devicePicker.onDevices(render);
      document.getElementById("cancel").addEventListener("click", () => window.devicePicker.cancel());
    </script>
  </body>
</html>
